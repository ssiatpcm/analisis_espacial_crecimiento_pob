name: ssiat-crecimiento

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12

  # Nucleo (versiones flexibles para que conda resuelva sin conflictos)
  - numpy
  - pandas<3.0
  - openpyxl
  - xlrd
  - scipy

  # Analisis espacial (conda-forge resuelve GDAL/GEOS/PROJ nativamente)
  - geopandas
  - shapely
  - pyproj
  - pyogrio
  - fiona
  - mapclassify

  # Graficos via conda-forge
  - matplotlib
  - seaborn
  - plotly
  - altair

  # ML
  - scikit-learn

  # Utilidades
  - requests
  - python-dotenv
  - watchdog

  # pip: todo lo que conda-forge no resuelve bien en Windows
  - pip
  - pip:
      - libpysal
      - esda
      - folium
      - branca
      - pydeck
      - streamlit==1.40.2
      - streamlit-folium==0.25.0
